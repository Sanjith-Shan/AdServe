[versions]
springBoot = "3.5.16"
dgs = "10.6.0"
grpc = "1.84.0"
protobuf = "4.36.2"
kafka = "4.1.2"
lettuce = "6.6.0.RELEASE"
testcontainers = "2.0.5"
junit = "5.13.4"
jqwik = "1.9.3"
hdr = "2.2.2"
jmh = "1.37"
postgres = "42.7.8"
assertj = "3.27.6"
slf4j = "2.0.17"
jackson = "2.19.2"
compress = "1.28.0"

[libraries]
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "compress" }
grpc-netty = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-services = { module = "io.grpc:grpc-services", version.ref = "grpc" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess", version.ref = "grpc" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
javax-annotation = { module = "javax.annotation:javax.annotation-api", version = "1.3.2" }
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
lettuce = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
hdr = { module = "org.hdrhistogram:HdrHistogram", version.ref = "hdr" }
postgres = { module = "org.postgresql:postgresql", version.ref = "postgres" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
tc-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
