# AdServe's dependencies. One of each, sized to stay under 8 GB of Docker memory in total.
# Host ports sit in the 2xxxx range so they do not collide with other local stacks.
name: adserve

services:
  kafka:
    restart: unless-stopped
    image: apache/kafka:3.9.1
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx768m"
    mem_limit: 1200m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  redis:
    restart: unless-stopped
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "768mb", "--maxmemory-policy", "noeviction"]
    ports: ["26379:6379"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adserve
      POSTGRES_PASSWORD: adserve
      POSTGRES_DB: adserve
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=100"]
    ports: ["25432:5432"]
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adserve"]
      interval: 3s
      retries: 20

  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d", "--web.enable-lifecycle"]
    ports: ["29090:9090"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 384m

  grafana:
    restart: unless-stopped
    image: grafana/grafana:12.1.1
    ports: ["23000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 384m

  # The server itself in a container, next to its dependencies (experiment 10). Normally the
  # server runs on the host; this profile removes the host port forwarder from the Redis path.
  adserve:
    build: ./server
    profiles: ["app"]
    ports: ["28080:28080", "29100:29100"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/adserve
      ADSERVE_KAFKA_BOOTSTRAP: kafka:9092
      ADSERVE_REDIS_URI: redis://redis:6379
      ADSERVE_SEED_FILE: /data/campaigns.json
      ADSERVE_FORECAST_FILE: /data/forecast.json
      ADSERVE_REDIS_CAP_TIMEOUT_MS: ${CAP_TIMEOUT_MS:-20}
    volumes:
      - ./data/work:/data:ro
    depends_on: [kafka, redis, postgres]
    mem_limit: 2g

  # Only for the latency-injection experiment: Redis reached through a proxy that can add delay.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    profiles: ["chaos"]
    restart: unless-stopped
    ports: ["28474:8474", "26380:26380"]
    mem_limit: 64m
